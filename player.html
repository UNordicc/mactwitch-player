<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacTwitch Player</title>
  <style>
    html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    (function () {
      "use strict";
      var channel = new URLSearchParams(window.location.search).get("channel") || "";
      if (!/^[a-z0-9_]{1,25}$/.test(channel)) { return; }

      function post(name) {
        var handlers = window.webkit && window.webkit.messageHandlers;
        if (handlers && handlers.player) { handlers.player.postMessage({ event: name }); }
      }

      var player = new Twitch.Player("player", {
        channel: channel,
        parent: [window.location.hostname],
        width: "100%",
        height: "100%",
        autoplay: true,
        muted: false
      });

      var events = [
        [Twitch.Player.READY, "ready"],
        [Twitch.Player.ONLINE, "online"],
        [Twitch.Player.OFFLINE, "offline"],
        [Twitch.Player.PLAY, "play"],
        [Twitch.Player.PAUSE, "pause"],
        [Twitch.Player.PLAYING, "playing"],
        [Twitch.Player.ENDED, "ended"],
        [Twitch.Player.PLAYBACK_BLOCKED, "playback_blocked"]
      ];
      events.forEach(function (pair) {
        player.addEventListener(pair[0], function () { post(pair[1]); });
      });

      // Pilot dla apki MacTwitch (natywne menu, kółko, skróty) — tylko oficjalne metody Twitch.Player.
      function clamp(v) { return Math.min(1, Math.max(0, Number(v) || 0)); }
      window.mactwitch = {
        togglePause: function () { if (player.isPaused()) { player.play(); } else { player.pause(); } return player.isPaused(); },
        setVolume: function (v) { player.setMuted(false); player.setVolume(clamp(v)); return player.getVolume(); },
        changeVolume: function (delta) { player.setMuted(false); player.setVolume(clamp(player.getVolume() + Number(delta))); return player.getVolume(); },
        toggleMute: function () { player.setMuted(!player.getMuted()); return player.getMuted(); },
        state: function () {
          return { paused: player.isPaused(), volume: player.getVolume(), muted: player.getMuted(),
                   quality: player.getQuality(), qualities: player.getQualities() };
        },
        setQuality: function (group) { player.setQuality(String(group)); return player.getQuality(); }
      };
    })();
  </script>
</body>
</html>
